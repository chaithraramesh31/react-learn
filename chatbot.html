<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        margin: 0;
      }
      .chatbot-container {
        font-family: Arial;
        max-width: 600px;
        height: 100vh;
        margin-left: auto;
        margin-right: auto;
        /* margin-top: 20px; */
        display: flex;
        flex-direction: column;
      }
      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }
      .send-button {
        background-color: #198754;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 15px;
        border-radius: 10px;
        cursor: pointer;
      }
      .chat-input {
        font-size: 15px;
        padding: 12px 15px;
        border-width: 1px;
        border-radius: 10px;
        margin-right: 10px;
        flex-grow: 1;
      }
      .chat-messages-container {
        overflow: scroll;
        scrollbar-width: none;
        -ms-overflow-style: none;
        flex-grow: 1;
        margin-top: 20px;
      }
      .chat-message-container-user,
      .chat-message-container-robot {
        display: flex;
        justify-content: flex-end;
        align-items: start;
        gap: 20px;
        margin-bottom: 20px;
      }
      .chat-message-container-robot {
        justify-content: flex-start;
      }
      .chat-message-contents {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        max-width: 300px;
        margin-top: 0;
        margin-bottom: 0;
        overflow-wrap: break-word;
      }
      .chat-message-profile {
        width: 45px;
        height: 45px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ chatmessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState('');
        const [isLoading, setIsLoading] = React.useState(false);
        function saveInputText(event) {
          setInputText(event.target.value);
          // console.log(event.target.value);
          // console.log(event.key);
        }
        async function sendMessage() {
          if(isLoading || inputText === '') {
            return;
          }
          setIsLoading(true);
          setInputText('');

          const newChatMessages = [
            ...chatmessages,
            {
              message: inputText,
              sender: "user"
            }
          ]
          setChatMessages([...newChatMessages,
            {
              message: 'Loading...',
              sender: 'robot'
            }
          ]);

          const response = await Chatbot.getResponseAsync(inputText);
          
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: "robot"
            }
          ]);

          setIsLoading(false);
        }

        function keyEvents(event) {
          if(event.key === 'Enter') {
            sendMessage();
          }
          if(event.key === 'Esc' || event.key === 'Escape') {
            setInputText('');
          }
        }
        return (
          <div className="chat-input-container">
            <input placeholder="Send a message to chatbot" size="30" onChange={saveInputText} onKeyDown={keyEvents} value={inputText} className="chat-input"/>
            <button onClick={sendMessage} className="send-button">Send</button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        // const message = props.message;
        // const sender = props.sender;
        // const { message, sender } = props;
        /*if(sender === 'robot') {
          return (
            <div>
              <img src="robot.png" width="50"/>
              {message}
            </div>
          );
        }*/
        return (
          <div className={sender === 'user' ? "chat-message-container-user" : "chat-message-container-robot"}>
            {sender === 'robot' && <img src="robot.png" className="chat-message-profile"/>}
            <p className="chat-message-contents">{message}</p>
            {sender === 'user' && <img src="user.png" className="chat-message-profile"/>}
          </div>
        );
      }

      function ChatMessages({ chatmessages }) {
        const chatMessagesRef = React.useRef(null);
        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if(containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [chatmessages]);
        return (
          <div className="chat-messages-container js-chat-message-container" ref={chatMessagesRef}>
            {chatmessages.map((chatMessage, index) => {
              return (
                <ChatMessage message={chatMessage.message} sender={chatMessage.sender} key={index} />
              );
            })}
          </div>
        );
      }

      function App() {
        const [chatmessages, setChatMessages] = React.useState([
          {
            message: 'hello chatbot',
            sender: 'user'
          },
          {
            message: 'Hello! How can I help you?',
            sender: 'robot'
          },
          {
            message: 'todays date',
            sender: 'user'
          },
          {
            message: 'Today is October 6',
            sender: 'robot'
          }
        ]);

        // const [chatmessages, setChatMessages] = array;

        // const chatmessages = array[0]; // current data
        // const setChatMessages = array[1] // function to update the data
        return (
          <div className="chatbot-container">
            <ChatMessages chatmessages={chatmessages}/>
            <ChatInput chatmessages={chatmessages} setChatMessages={setChatMessages}/>
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
