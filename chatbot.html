<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ chatmessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState('');
        const [isLoading, setIsLoading] = React.useState(false);
        function saveInputText(event) {
          setInputText(event.target.value);
          // console.log(event.target.value);
          // console.log(event.key);
        }
        async function sendMessage() {
          if(isLoading || inputText === '') {
            return;
          }
          setIsLoading(true);
          setInputText('');

          const newChatMessages = [
            ...chatmessages,
            {
              message: inputText,
              sender: "user"
            }
          ]
          setChatMessages([...newChatMessages,
            {
              message: 'Loading...',
              sender: 'robot'
            }
          ]);

          const response = await Chatbot.getResponseAsync(inputText);
          
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: "robot"
            }
          ]);

          setIsLoading(false);
        }

        function keyEvents(event) {
          if(event.key === 'Enter') {
            sendMessage();
          }
          if(event.key === 'Esc' || event.key === 'Escape') {
            setInputText('');
          }
        }
        return (
          <>
            <input placeholder="Send a message to chatbot" size="30" onChange={saveInputText} onKeyDown={keyEvents} value={inputText}/>
            <button onClick={sendMessage}>Send</button>
          </>
        );
      }

      function ChatMessage({ message, sender }) {
        // const message = props.message;
        // const sender = props.sender;
        // const { message, sender } = props;
        /*if(sender === 'robot') {
          return (
            <div>
              <img src="robot.png" width="50"/>
              {message}
            </div>
          );
        }*/
        return (
          <div>
            {sender === 'robot' && <img src="robot.png" width="50"/>}
            {message}
            {sender === 'user' && <img src="user.png" width="50"/>}
          </div>
        );
      }

      function ChatMessages({ chatmessages }) {
        return (
          <>
            {chatmessages.map((chatMessage, index) => {
              return (
                <ChatMessage message={chatMessage.message} sender={chatMessage.sender} key={index} />
              );
            })}
          </>
        );
      }

      function App() {
        const [chatmessages, setChatMessages] = React.useState([
          {
            message: 'hello chatbot',
            sender: 'user'
          },
          {
            message: 'Hello! How can I help you?',
            sender: 'robot'
          },
          {
            message: 'todays date',
            sender: 'user'
          },
          {
            message: 'Today is October 6',
            sender: 'robot'
          }
        ]);

        // const [chatmessages, setChatMessages] = array;

        // const chatmessages = array[0]; // current data
        // const setChatMessages = array[1] // function to update the data
        return (
          <>
            <ChatInput chatmessages={chatmessages} setChatMessages={setChatMessages}/>
            <ChatMessages chatmessages={chatmessages}/>
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
